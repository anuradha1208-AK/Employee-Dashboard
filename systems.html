<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Systems & Analytics - Dashboard</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-orange: #f38b1c;
      --primary-orange-hover: #d9740b;
      --primary-orange-light: #fff5eb;
      --primary-orange-glow: rgba(243, 139, 28, 0.25);
      
      --dark-sidebar: #1a1c23;
      --dark-sidebar-header: #111217;
      
      --text-dark: #18181b;
      --text-muted: #64748b;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      --shadow-glow: 0 10px 20px -3px var(--primary-orange-glow);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 250px;
      background-color: #ffffff;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
    }

    .sidebar-header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .sidebar-header .logo {
      max-width: 100%;
      height: auto;
    }

    .sidebar-nav ul {
      list-style: none;
      padding: 15px 0;
    }

    .sidebar-nav a, 
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 500;
      position: relative;
      transition: all 0.25s ease;
    }

    .sidebar-nav a::before,
    .nav-btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background-color: var(--primary-orange);
      transform: scaleY(0);
      transition: transform 0.2s ease;
    }

    .sidebar-nav a:hover,
    .nav-btn:hover {
      background-color: var(--primary-orange-light);
      color: var(--primary-orange-hover);
    }

    .sidebar-nav a.active,
    .nav-btn.active {
      background-color: var(--primary-orange-light);
      color: var(--primary-orange);
      font-weight: 600;
    }

    .sidebar-nav a.active::before,
    .nav-btn.active::before {
      transform: scaleY(1);
    }

    /* Sub-menu inside Systems */
    .nav-section-title {
      padding: 12px 24px 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .sub-nav {
      padding-left: 12px !important;
    }

    .sub-nav a {
      font-size: 0.9rem;
      padding: 10px 20px 10px 28px;
    }

    .sidebar-footer {
      padding: 1.5rem 1rem;
      border-top: 1px solid var(--border-color);
    }

    .btn-logout {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--primary-orange);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-logout:hover {
      background-color: var(--primary-orange-hover);
    }

    .btn-logout:active {
      transform: scale(0.98);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      padding: 30px;
      max-width: calc(100vw - 260px);
    }

    .page-header {
      margin-bottom: 25px;
    }

    .page-header h1 {
      font-size: 1.6rem;
      color: var(--text-dark);
    }

    .header-divider {
      height: 3px;
      width: 60px;
      background-color: var(--primary-orange);
      margin-top: 6px;
      border-radius: 2px;
    }

    /* System Quick Access Cards */
    .systems-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .system-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .system-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-glow);
      border-color: var(--primary-orange);
    }

    .system-card-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .system-card-icon {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      background-color: var(--primary-orange-light);
      color: var(--primary-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .system-card-info h3 {
      font-size: 1.1rem;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .system-card-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-open-system {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background-color: var(--dark-sidebar);
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-open-system:hover {
      background-color: var(--primary-orange);
      color: #ffffff;
    }

 
   
@media (max-width: 768px) {
  
  .app-container {
    flex-direction: column;
  }

 
  .sidebar {
    width: 100%;
    height: auto;
    min-height: auto;
    position: relative;
    border-right: none;
    border-bottom: 1px solid var(--border-color);
  }

  .sidebar-header {
    padding: 12px 20px;
  }

  .sidebar-nav ul {
    display: flex;
    overflow-x: auto;

    padding: 8px 10px;
    gap: 5px;
  }

  .sidebar-nav a, 
  .nav-btn {
    padding: 8px 14px;
    white-space: nowrap;
    font-size: 0.88rem;
    border-radius: 6px;
  }

  
  .sidebar-nav a::before,
  .nav-btn::before {
    display: none;
  }

  .sidebar-footer {
    padding: 0.8rem 1rem;
  }

  
  .main-content {
    max-width: 100%;
    width: 100%;
    padding: 15px;
  }

 
  .flex-header {
    flex-direction: column;
    align-items: stretch;
  }

  .search-box, 
  .search-box input {
    width: 100%;
  }

  .search-box input:focus {
    width: 100%;
  }


  .metrics-grid {
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }

  .metric-card {
    padding: 15px;
    gap: 12px;
  }

  .metric-card i {
    font-size: 1.6rem;
  }

  .metric-card p {
    font-size: 1.3rem;
  }

 
  .profile-card-header {
    flex-direction: column;
    text-align: center;
    padding: 20px 15px;
    gap: 15px;
  }

  
  .sheet-tabs {
    overflow-x: auto;
    padding-bottom: 8px;
    white-space: nowrap;
  }

  .tab-btn {
    flex-shrink: 0;
  }

  /* Modals */
  .modal-content {
    width: 95%;
    padding: 18px;
    max-height: 90vh;
  }

  .placeholder-box {
    padding: 30px 15px;
  }
}

/* Small Mobile Screens (Max-Width: 480px) */
@media (max-width: 480px) {
  /* Enforce single column for cards on very small displays */
  .metrics-grid,
  .gallery-grid,
  .client-grid,
  .cards-grid,
  .sheets-grid {
    grid-template-columns: 1fr;
  }

  .employee-card img {
    width: 70px;
    height: 70px;
  }

  .custom-data-table,
  .custom-table {
    font-size: 0.78rem;
  }
}

  </style>

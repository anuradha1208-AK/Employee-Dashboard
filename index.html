        <div class="header-divider"></div>

          </div>

            </div>

            <i class="fa-solid fa-file-excel"></i>
            <div>
              <h3>Active Sheets</h3>
              <p>37</p>
            </div>
          </div>

        <!-- Active Projects Gallery -->
        <div class="section-block">
          <h2>Active Project Photos</h2>
          <div class="gallery-grid">
            <div class="gallery-card">
              <img src="Projects Images/7.jpg" alt="Airtech Project Site, Goa" onerror="this.src='https://via.placeholder.com/300x160?text=Goa+Project'">

  <script src="script.js"></script>
  <script>
    // Set Current Date Automatically
    document.addEventListener('DOMContentLoaded', () => {
      const dateElem = document.getElementById('current-date-display');
      if (dateElem) {
        const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
        dateElem.innerText = new Date().toLocaleDateString('en-US', options);
      }
    });

    function logout() {
      sessionStorage.removeItem('isLoggedIn');
      window.location.href = 'login.html';
    }
  </script>
